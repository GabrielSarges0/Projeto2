spring.datasource.url=jdbc:h2:file:./data/projeto2;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=8080
management.endpoints.web.exposure.include=health,info

# Login local (no Render use APP_ADMIN_USER / APP_ADMIN_PASSWORD)
app.auth.username=${APP_ADMIN_USER:admin}
app.auth.password=${APP_ADMIN_PASSWORD:admin12345}

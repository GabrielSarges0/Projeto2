# Perfil de produção (Render + Supabase). Credenciais vêm só de variáveis de ambiente.
# DATABASE_URL precisa estar no formato JDBC: jdbc:postgresql://<host>:5432/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Plano gratuito: poucas conexões no pooler do Supabase e 512 MB de RAM no Render.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Schema próprio, fora do "public" exposto pela API REST do Supabase.
spring.flyway.schemas=projeto2
spring.flyway.default-schema=projeto2
spring.jpa.properties.hibernate.default_schema=projeto2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info

# Login do painel: sem valor padrão, a aplicação não sobe sem as variáveis.
app.auth.username=${APP_ADMIN_USER}
app.auth.password=${APP_ADMIN_PASSWORD}

# Assina os tokens de sessão. Sem APP_TOKEN_SECRET, deriva da senha técnica (já configurada no Render).
app.auth.token-secret=${APP_TOKEN_SECRET:${APP_ADMIN_PASSWORD}}
# E-mails que sempre entram como Gerente (separados por vírgula). Opcional.
# Teste do MVP: todos entram como Gerente. Depois do teste, defina APP_ALL_MANAGERS=false no Render.
app.auth.all-managers=${APP_ALL_MANAGERS:true}
app.auth.manager-emails=${APP_MANAGER_EMAILS:gabrielsarges1926@gmail.com,hbsv@cesar.school}

# Notificações diárias de alertas por e-mail (Render)
app.alerts.scheduling.enabled=${APP_ALERTS_SCHEDULING_ENABLED:true}
app.alerts.cron=${APP_ALERTS_CRON:0 0 8 * * *}
app.alerts.mail.webhook-url=${APP_MAIL_WEBHOOK_URL:}
app.alerts.mail.api-key=${APP_MAIL_API_KEY:}
app.alerts.mail.from=${APP_MAIL_FROM:alertas@fundacaomanuelcruz.org.br}

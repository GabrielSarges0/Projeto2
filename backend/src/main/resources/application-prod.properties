# Perfil de produção (Render + Supabase). Credenciais vêm só de variáveis de ambiente.
# DATABASE_URL precisa estar no formato JDBC: jdbc:postgresql://<host>:5432/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Plano gratuito: poucas conexões no pooler do Supabase e 512 MB de RAM no Render.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Schema próprio, fora do "public" exposto pela API REST do Supabase.
spring.flyway.schemas=projeto2
spring.flyway.default-schema=projeto2
spring.jpa.properties.hibernate.default_schema=projeto2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info

# Login do painel: sem valor padrão, a aplicação não sobe sem as variáveis.
app.auth.username=${APP_ADMIN_USER}
app.auth.password=${APP_ADMIN_PASSWORD}
